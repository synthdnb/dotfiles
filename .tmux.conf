unbind C-b
unbind l
set -g prefix `
bind-key o last-window
bind-key ` send-prefix
bind-key k kill-window
bind-key b break-pane
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r move-window -r
bind y setw synchronize-panes
# pane movement
bind-key j command-prompt -p "join pane from:"  "join-pane -s '%%'"
bind-key s command-prompt -p "send pane to:"  "join-pane -t '%%'"

set -g default-terminal "screen-256color"
set -g default-shell /bin/zsh
set -g default-command /bin/zsh
set -g history-limit 10000
set -s escape-time 0
set -wg mode-keys vi

# === Status Bar for Worktree/Session Management ===

set -g status-style bg=default,fg=white

# Left: Session name (prominent)
set -g status-left '#[fg=colour0,bg=colour117,bold] #S #[fg=colour117,bg=default] '
set -g status-left-length 30

# Right: git branch + time
set -g status-right '#[fg=colour183]#(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null) #[fg=colour015][%H:%M]'
set -g status-right-length 100

# Refresh status more frequently to catch notifications
set -g status-interval 2

set -g status-justify right

# Window status styling
set -wg window-status-style fg=colour242
set -wg window-status-current-style bg=default,fg=colour229
# ~/.tmux.conf
set -g window-status-format '#I:#W#{?@workmux_status, #{@workmux_status},}#{?window_flags,#{window_flags}, }'
set -g window-status-current-format '#I:#W#{?@workmux_status, #{@workmux_status},}#{?window_flags,#{window_flags}, }'

# Auto-name windows to current directory
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

set -g extended-keys on
set -g extended-keys-format csi-u
# === Session/Worktree Navigation ===

# Rename session to current worktree folder name
bind-key R run-shell 'tmux rename-session "$(basename #{pane_current_path})"'

# Quick session switcher with fzf
bind-key f display-popup -E "tmux list-sessions -F '#{session_name}' | fzf --reverse | xargs tmux switch-client -t"

# Quick window switcher with fzf (shows path for context)
bind-key W display-popup -E "tmux list-windows -a -F '#{session_name}:#{window_index} #{window_name} #{pane_current_path}' | fzf --reverse | cut -d' ' -f1 | xargs tmux switch-client -t"

# Switch between sessions quickly
bind-key ( switch-client -p
bind-key ) switch-client -n

# Reload config
bind = source-file ~/.tmux.conf \; display-message "Config reloaded"

# List of plugins
# Supports `github_username/repo` or full git URLs
set -g @tpm_plugins "              \
  tmux-plugins/tpm                 \
    tmux-plugins/tmux-sensible       \
    "
    # Other examples:
    # github_username/plugin_name    \
    # git@github.com/user/plugin     \
    # git@bitbucket.com/user/plugin  \

    # Initializes TMUX plugin manager.
    # Keep this line at the very bottom of tmux.conf.
    run-shell ~/.tmux/plugins/tpm/tpm
